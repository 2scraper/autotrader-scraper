# One real run of each mode against autotrader.com, daily. tests.yml
# (deliberately) never touches the site.
#
# This canary NEEDS a secret, and skips without one rather than going red.
# autotrader.com serves its pages to a US residential exit with a headful
# browser, and refused every datacentre address this repo was measured from
# (2026-09-24). A GitHub runner is a datacentre address; what the site
# answers a runner specifically has not been measured, so the job does not
# pretend to know: with no secret it says why it is not running and goes
# green, because a check that is always red teaches everyone to ignore
# checks (CLAUDE.md §11).
#
# To turn it on, a US residential proxy:
#
#     gh secret set AUTOTRADER_PROXY --repo 2scraper/autotrader-scraper
#
# It goes through the ENVIRONMENT, not a --proxy line: env_config.py reads
# exactly that variable, an unset secret arrives as an empty string which the
# loader treats as unset, and the credential never reaches a command line.

name: canary

on:
  schedule:
    # 06:20 UTC. Not on the hour: every scheduled workflow fires at :00.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOTRADER_PROXY: ${{ secrets.AUTOTRADER_PROXY }}
      # A filtered search, >= 3 pages (§11: with one page, pagination is
      # never exercised). 557-558 matches on 2026-09-24, so three pages of 25
      # are full with room to spare.
      CANARY_URL: "https://www.autotrader.com/cars-for-sale/used-cars/toyota/camry/new-york-ny?searchRadius=50"
    steps:
      - name: Skip without a proxy
        if: env.AUTOTRADER_PROXY == ''
        run: |
          echo "::notice::canary skipped: no AUTOTRADER_PROXY secret. autotrader.com serves a US residential exit with a headful browser, and refused every datacentre address measured; set the secret to run this (see the workflow header)."

      - uses: actions/checkout@v4
        if: env.AUTOTRADER_PROXY != ''
      - uses: actions/setup-python@v5
        if: env.AUTOTRADER_PROXY != ''
        with:
          python-version: "3.12"

      - name: Install
        if: env.AUTOTRADER_PROXY != ''
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Listing, 3 pages (headful, under xvfb)
        id: listing
        if: env.AUTOTRADER_PROXY != ''
        run: |
          set +e   # `run:` is `bash -e`; without this a non-zero exit aborts
                   # the step before the echo below records it.
          xvfb-run -a python playwright_scraper.py --url "$CANARY_URL" --pages 3 \
            --out canary --format both --dump-html canary_dump.html
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret the listing run
        if: env.AUTOTRADER_PROXY != ''
        run: |
          code="${{ steps.listing.outputs.exit_code }}"
          echo "exit code: $code"
          case "$code" in
            0) ;;
            3) echo "::error::Blocked (akamai-unavailable is the site's 'page unavailable'). The exit in AUTOTRADER_PROXY was refused: check it is US and residential."; exit 1 ;;
            4) echo "::error::Zero rows from a search that is never empty. The page's store has moved; see canary_dump.html."; exit 1 ;;
            5) echo "::error::The pages never arrived (a dead proxy or a timeout)."; exit 1 ;;
            2) echo "::error::Refused as bad usage. If the log says the site WIDENED the search, the canary URL's slugs no longer match the site's."; exit 1 ;;
            *) echo "::error::Unexpected exit $code."; exit 1 ;;
          esac

      - name: Assert the listing run
        if: env.AUTOTRADER_PROXY != ''
        run: |
          python - <<'EOF'
          import json, sys
          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          problems = []
          if meta["status"] != "complete":
              problems.append("status %r (%s)" % (meta["status"], meta["stop_reason"]))
          if meta["pages_completed"] != 3:
              problems.append("pages_completed %r, not 3" % meta["pages_completed"])
          if len(rows) < 60:
              problems.append("%d rows, floor 60" % len(rows))
          if not meta.get("total_results") or meta.get("pages_available") is None:
              problems.append("the site's own count is missing from the sidecar")
          pairs = [(r["page"], r["position"]) for r in rows]
          if len(set(pairs)) != len(pairs):
              problems.append("page+position is not unique")
          priced = [r for r in rows if r["price"] is not None]
          if len(priced) < 0.8 * len(rows):
              problems.append("%d of %d rows have a price" % (len(priced), len(rows)))
          bad = [r["sku"] for r in priced if r["price_before_fees"] is not None
                 and r["price"] < r["price_before_fees"]]
          if bad:
              problems.append("price below its pre-fee price on %s" % bad[:3])
          if {r["currency"] for r in rows} != {"USD"}:
              problems.append("currency %r" % {r["currency"] for r in rows})
          if sum(1 for r in rows if r["vin"]) < len(rows):
              problems.append("a row without a VIN")
          if {r["condition"] for r in rows} - {"USED", "CERTIFIED"}:
              problems.append("a used-cars search returned %r" % {r["condition"] for r in rows})
          if problems:
              print("canary FAILED: " + "; ".join(problems))
              sys.exit(1)
          print("canary OK: %d rows of %s, complete" % (len(rows), meta["total_results"]))
          json.dump(rows[:3], open("canary_ids.json", "w"))
          EOF

      - name: Vehicle mode, the first three results
        if: env.AUTOTRADER_PROXY != ''
        run: |
          xvfb-run -a python playwright_scraper.py --from-listing canary_ids.json \
            --out canary_vehicle --format json
          python - <<'EOF'
          import json, sys
          rows = json.load(open("canary_vehicle.json"))
          meta = json.load(open("canary_vehicle.meta.json"))
          if meta["status"] != "complete" or len(rows) + len(meta["vehicles_gone"]) != 3:
              sys.exit("vehicle canary FAILED: %r" % meta)
          if any(not r["features"] for r in rows):
              sys.exit("vehicle canary FAILED: a detail row without features")
          print("vehicle canary OK: %d rows, %d gone" % (len(rows), len(meta["vehicles_gone"])))
          EOF

      - uses: actions/upload-artifact@v4
        if: always() && env.AUTOTRADER_PROXY != ''
        with:
          name: canary
          path: |
            canary.json
            canary.csv
            canary.meta.json
            canary_vehicle.json
            canary_vehicle.meta.json
            canary_dump.html*
            canary_page*_debug.html
          if-no-files-found: ignore
