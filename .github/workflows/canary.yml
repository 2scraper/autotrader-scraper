# One real run of each mode against autotrader.com, weekly (every run bills
# the proxy exit, so it runs on Mondays; a manual dispatch runs it any time). tests.yml
# (deliberately) never touches the site.
#
# This canary NEEDS a secret, and FAILS without one. autotrader.com serves
# its pages to a US residential exit with a headful browser, and refused
# every datacentre address this repo was measured from (2026-09-24). A
# canary that skips green says nothing about the site while its badge says
# all is well, so a missing secret is reported as a red run naming it.
#
# To turn it on, a US residential proxy:
#
#     gh secret set AUTOTRADER_PROXY --repo 2scraper/autotrader-scraper
#
# Set since 2026-09-25. From its own history: 11 of 12 runs green to
# 2026-10-06, all through the secret (none skipped); the red one, 2026-10-04,
# was three 60 s navigation timeouts at the exit (exit 5) — the exit, not
# the site, as the next morning's green run showed.
#
# It goes through the ENVIRONMENT, not a --proxy line: env_config.py reads
# exactly that variable, an unset secret arrives as an empty string which the
# loader treats as unset, and the credential never reaches a command line.

name: canary

on:
  schedule:
    # Mondays 06:20 UTC. Weekly, not daily: every run bills the proxy exit.
    # Not on the hour: every scheduled workflow fires at :00.
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOTRADER_PROXY: ${{ secrets.AUTOTRADER_PROXY }}
      # A filtered search, >= 3 pages (with one page, pagination is never
      # exercised). 557-558 matches on 2026-09-24, so three pages of 25
      # are full with room to spare.
      CANARY_URL: "https://www.autotrader.com/cars-for-sale/used-cars/toyota/camry/new-york-ny?searchRadius=50"
    steps:
      - name: Fail without a proxy
        if: env.AUTOTRADER_PROXY == ''
        run: |
          echo "::error::canary cannot test the site: the AUTOTRADER_PROXY secret is missing or empty. autotrader.com serves a US residential exit with a headful browser and refused every datacentre address measured; set the secret (see the workflow header)."
          exit 1

      - uses: actions/checkout@v4
        if: env.AUTOTRADER_PROXY != ''
      - uses: actions/setup-python@v5
        if: env.AUTOTRADER_PROXY != ''
        with:
          python-version: "3.12"

      - name: Install
        if: env.AUTOTRADER_PROXY != ''
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Listing, 3 pages (headful, under xvfb)
        id: listing
        if: env.AUTOTRADER_PROXY != ''
        run: |
          set +e   # `run:` is `bash -e`; without this a non-zero exit aborts
                   # the step before the echo below records it.
          xvfb-run -a python playwright_scraper.py --url "$CANARY_URL" --pages 3 \
            --out canary --format both --dump-html canary_dump.html --proxy-budget-mb 15 2>&1 | tee canary.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # What the run sent through AUTOTRADER_PROXY and the budget it ran
      # under, both read from its sidecar; red when it stopped at that budget
      # (stop_reason proxy_budget_exceeded). Both canary runs pass 15 MB,
      # above the scraper's 10 MB default: measured 2026-10-21, the listing
      # run used 9.4 MB and the vehicle run 8.3 MB, each near a 10 MB cap.
      - name: Proxy traffic (listing)
        if: always() && env.AUTOTRADER_PROXY != ''
        run: python3 .github/proxy_traffic_summary.py canary "run listing"

      - name: Interpret the listing run
        # Runs even when "Proxy traffic (listing)" above failed (budget
        # exceeded): that step already fails the job, and this one still
        # reports the run's own verdict instead of being skipped.
        if: ${{ !cancelled() && env.AUTOTRADER_PROXY != '' && steps.listing.outcome != 'skipped' }}
        run: |
          code="${{ steps.listing.outputs.exit_code }}"
          echo "exit code: $code"
          case "$code" in
            0) ;;
            3) echo "::error::Blocked (akamai-unavailable is the site's 'page unavailable'). The exit in AUTOTRADER_PROXY was refused: check it is US and residential."; exit 1 ;;
            4) echo "::error::Zero rows from a search that is never empty. The page's store has moved; see canary_dump.html."; exit 1 ;;
            5|6)
              # A run that read nothing writes no sidecar, so the log is
              # where the reason is. A served page the parser cannot read is
              # named apart from a page that never arrived.
              if grep -q "has changed shape" canary.log; then
                echo "::error::parser_found_nothing: the site served its results page and the parser could not read it. The page changed shape; see canary_page*_debug.html."
              elif [ "$code" = 5 ]; then
                echo "::error::The pages never arrived (a dead proxy or a timeout)."
              else
                echo "::error::Partial run: some pages were gathered, then the run stopped. See canary.meta.json."
              fi
              exit 1 ;;
            2) echo "::error::Refused as bad usage. If the log says the site WIDENED the search, the canary URL's slugs no longer match the site's."; exit 1 ;;
            *) echo "::error::Unexpected exit $code."; exit 1 ;;
          esac

      - name: Assert the listing run
        if: env.AUTOTRADER_PROXY != ''
        run: |
          python - <<'EOF'
          import json, sys
          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          problems = []
          if meta["status"] != "complete":
              problems.append("status %r (%s)" % (meta["status"], meta["stop_reason"]))
          if meta["pages_completed"] != 3:
              problems.append("pages_completed %r, not 3" % meta["pages_completed"])
          if len(rows) < 60:
              problems.append("%d rows, floor 60" % len(rows))
          if not meta.get("total_results") or meta.get("pages_available") is None:
              problems.append("the site's own count is missing from the sidecar")
          pairs = [(r["page"], r["position"]) for r in rows]
          if len(set(pairs)) != len(pairs):
              problems.append("page+position is not unique")
          priced = [r for r in rows if r["price"] is not None]
          if len(priced) < 0.8 * len(rows):
              problems.append("%d of %d rows have a price" % (len(priced), len(rows)))
          bad = [r["sku"] for r in priced if r["price_before_fees"] is not None
                 and r["price"] < r["price_before_fees"]]
          if bad:
              problems.append("price below its pre-fee price on %s" % bad[:3])
          if {r["currency"] for r in rows} != {"USD"}:
              problems.append("currency %r" % {r["currency"] for r in rows})
          for col in ("sku", "title", "vin", "year", "make", "model", "seller_name"):
              if sum(1 for r in rows if r[col] not in (None, "")) < len(rows):
                  problems.append("a row without %s" % col)
          # A moved store still exits 0 with columns empty; the sidecar names
          # them, and this is where that turns red rather than into a log line.
          if meta.get("fields_below_floor"):
              problems.append("columns below their floor: %r (coverage %r)"
                              % (meta["fields_below_floor"], meta.get("field_coverage")))
          if meta.get("results_without_record"):
              problems.append("%d listed result(s) had no record"
                              % meta["results_without_record"])
          if {r["condition"] for r in rows} - {"USED", "CERTIFIED"}:
              problems.append("a used-cars search returned %r" % {r["condition"] for r in rows})
          if problems:
              print("canary FAILED: " + "; ".join(problems))
              sys.exit(1)
          print("canary OK: %d rows of %s, complete" % (len(rows), meta["total_results"]))
          json.dump(rows[:3], open("canary_ids.json", "w"))
          EOF

      - name: Vehicle mode, the first three results
        if: env.AUTOTRADER_PROXY != ''
        run: |
          xvfb-run -a python playwright_scraper.py --from-listing canary_ids.json \
            --out canary_vehicle --format json --proxy-budget-mb 15
          python - <<'EOF'
          import json, sys
          rows = json.load(open("canary_vehicle.json"))
          meta = json.load(open("canary_vehicle.meta.json"))
          if meta["status"] != "complete" or len(rows) + len(meta["vehicles_gone"]) != 3:
              sys.exit("vehicle canary FAILED: %r" % meta)
          if any(not r["features"] for r in rows):
              sys.exit("vehicle canary FAILED: a detail row without features")
          if meta.get("fields_below_floor"):
              sys.exit("vehicle canary FAILED: columns below their floor: %r"
                       % meta["fields_below_floor"])
          print("vehicle canary OK: %d rows, %d gone" % (len(rows), len(meta["vehicles_gone"])))
          EOF

      - name: Proxy traffic (vehicle)
        if: always() && env.AUTOTRADER_PROXY != ''
        run: python3 .github/proxy_traffic_summary.py canary_vehicle "run vehicle"

      - uses: actions/upload-artifact@v4
        if: always() && env.AUTOTRADER_PROXY != ''
        with:
          name: canary
          path: |
            canary.json
            canary.csv
            canary.meta.json
            canary_vehicle.json
            canary_vehicle.meta.json
            canary_dump.html*
            canary_page*_debug.html
            canary.log
          if-no-files-found: ignore
